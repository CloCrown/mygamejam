<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Horse 2D rig - real Blender export</title>
<style>
  html, body { margin: 0; background: #cfe8ff; overflow: hidden; font-family: sans-serif; }
  canvas { display: block; margin: 40px auto; background: #fff; border: 1px solid #999; }
  p { text-align: center; color: #333; }
</style>
</head>
<body>
<p>Rig 2D reel (Blender -&gt; JSON -&gt; JS genere). Corps dessine une seule fois ; seules les pattes (2 formes existantes) sont rejouees une 2e fois avec un dephasage, pour donner 4 pattes sans dupliquer tout le cheval.</p>
<canvas id="canvas" width="700" height="400"></canvas>
<script src="horse-mesh-2d.js"></script>
<script src="horse-rig-2d.js"></script>
<script>
"use strict";
var canvas = document.querySelector("#canvas");
var ctx = canvas.getContext("2d");
var rig = buildHorseRig2D();
var LEG_BONES = ["thigh.L", "foot.L", "toe.L", "front_thigh.L", "front_foot.L", "front_toe.L"];
var split = splitBodyAndLegTriangles(rig, LEG_BONES);

// Bones/mesh are in Blender meters (~0.1 unit tall). Scale up + flip Y
// (Blender Y-up vs canvas Y-down) to draw on a pixel canvas.
var SCALE = 2500;
var OFFSET_X = 350;
var OFFSET_Y = 320;
// Small screen-space offset for the far leg pass, to suggest depth -
// applied only to leg triangles, never to the body.
var FAR_OFFSET_X = -6;
var FAR_OFFSET_Y = -3;

function drawTriangles(ctx, pos, idx, offsetX, offsetY, fillStyle) {
  ctx.fillStyle = fillStyle;
  for (var t = 0; t < idx.length; t += 3) {
    var ia = idx[t], ib = idx[t + 1], ic = idx[t + 2];
    ctx.beginPath();
    ctx.moveTo(pos[ia * 2] * SCALE + OFFSET_X + offsetX, -pos[ia * 2 + 1] * SCALE + OFFSET_Y + offsetY);
    ctx.lineTo(pos[ib * 2] * SCALE + OFFSET_X + offsetX, -pos[ib * 2 + 1] * SCALE + OFFSET_Y + offsetY);
    ctx.lineTo(pos[ic * 2] * SCALE + OFFSET_X + offsetX, -pos[ic * 2 + 1] * SCALE + OFFSET_Y + offsetY);
    ctx.closePath();
    ctx.fill();
  }
}

var start = null;
function draw(ts) {
  if (start === null) start = ts;
  var time = (ts - start) / 1000;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Source rig/mesh was authored facing right-to-left (see
  // my_horse_side_view.svg); mirror horizontally here so the horse faces
  // left-to-right on screen, the standard run direction for a platformer.
  ctx.save();
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);

  // Pass 1: far legs (drawn first, behind, phase-shifted + slightly offset).
  animateHorseRig2D(rig, time, 1.6, FAR_LEG_PHASE_OFFSET_2D);
  drawTriangles(ctx, rig.skinnedPositions, split.legs, FAR_OFFSET_X, FAR_OFFSET_Y, "#a9713f");

  // Pass 2: body, drawn once at the near (unshifted) phase.
  animateHorseRig2D(rig, time, 1.6, 0);
  drawTriangles(ctx, rig.skinnedPositions, split.body, 0, 0, "#c98a52");

  // Pass 3: near legs, on top, at the same near phase as the body.
  drawTriangles(ctx, rig.skinnedPositions, split.legs, 0, 0, "#c98a52");

  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
