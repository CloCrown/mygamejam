<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Horse mesh split debug</title>
<style>
  html, body { margin: 0; background: #cfe8ff; font-family: sans-serif; }
  canvas { display: block; margin: 20px auto; background: #fff; border: 1px solid #999; }
  #panel { max-width: 700px; margin: 0 auto; }
  #legend label { display: inline-flex; align-items: center; gap: 6px; margin: 4px 10px 4px 0; font-size: 14px; }
  #legend input[type="checkbox"] { margin: 0; }
  #legend select { font-size: 13px; }
  #colorLegend { margin: 10px 0; font-size: 13px; }
  #colorLegend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 14px; }
  #colorLegend .swatch { display: inline-block; width: 14px; height: 14px; border: 1px solid #333; }
  #zoneTable { border-collapse: collapse; font-size: 13px; margin: 10px 0; }
  #zoneTable th, #zoneTable td { padding: 3px 8px; text-align: left; }
  #zoneTable input[type="number"] { width: 60px; }
  #modeSwitch { margin: 10px 0; font-size: 14px; }
</style>
</head>
<body>
<canvas id="canvas" width="700" height="400"></canvas>
<div id="panel">
  <div id="colorLegend"></div>
  <div id="modeSwitch">
    <label><input type="radio" name="mode" value="bones" checked> Groupes par os (Blender)</label>
    <label><input type="radio" name="mode" value="zones"> Groupes par zone (position à l'écran)</label>
  </div>
  <div id="legend"></div>
  <table id="zoneTable" hidden>
    <thead><tr><th>Zone</th><th>Couleur</th><th>x min</th><th>x max</th><th>y min</th><th>y max</th><th>tris</th></tr></thead>
    <tbody></tbody>
  </table>
  <button id="copyZonesBtn" hidden>Copier les zones en JSON</button>
  <span id="copyZonesStatus"></span>
</div>
<script src="horse-mesh-2d.js"></script>
<script src="horse-rig-2d.js"></script>
<script>
"use strict";
var canvas = document.querySelector("#canvas");
var ctx = canvas.getContext("2d");
var rig = buildHorseRig2D();
rig.updateWorld();
rig.updateSkin();

// Same groups as game.js's meshSplit, kept here for independent visual
// iteration without touching the game loop - see CLAUDE.md exploration
// rule. splitTrianglesByBoneGroups uses majority-vote matching (2 of 3
// triangle corners), which fixed gaps at limb/torso seams that a strict
// all-3-corners match left behind.
var GROUPS = [
  { name: "body", color: "#c98a52", colorName: "brun clair" }, // implicit leftover group, always present
  { name: "toes", bones: ["toe.L", "front_toe.L"], color: "#3d7fb8", colorName: "bleu" },
  { name: "thighs", bones: ["thigh.L", "front_thigh.L"], color: "#e08030", colorName: "orange" },
  { name: "shins", bones: ["foot.L", "front_foot.L"], color: "#ff00ff", colorName: "magenta" },
  { name: "tail", bones: ["tail.001", "tail.002"], color: "#00aa00", colorName: "vert" },
  { name: "neck", bones: ["neck"], color: "#cccc00", colorName: "jaune" },
  { name: "head", bones: ["head"], color: "#00aaaa", colorName: "cyan" },
];
var boneSplit = splitTrianglesByBoneGroups(rig, GROUPS.filter(function (g) { return g.bones; }));

// Bones/mesh are in Blender meters. Bind-pose bounding box is roughly
// x:[-0.53,0.53] y:[0.04,0.99] (checked directly against
// rig.skinnedPositions) - scale/offset picked to fit that fully inside the
// 700x400 canvas with margin, flipping Y (Blender Y-up vs canvas Y-down).
var SCALE = 350;
var OFFSET_X = 350;
var OFFSET_Y = 380;

// ---- Zone-based split: classifies each triangle by where its centroid
// sits in mesh-local space (x/y bounding box), not by which bone its
// vertices are weighted to. A triangle falls in the first zone (in list
// order) whose box contains its centroid; anything unmatched stays "body".
// Boxes are in the same local units as rig.skinnedPositions (roughly
// x:[-0.53,0.53] y:[0.04,0.99] for the whole horse), editable live below.
var ZONES = [
  { name: "toe", color: "#3d7fb8", colorName: "bleu", xMin: -0.53, xMax: 0.1, yMin: 0.03, yMax: 0.15 },
  { name: "front_toe", color: "#1a3f5c", colorName: "bleu foncé", xMin: 0.1, xMax: 0.53, yMin: 0.03, yMax: 0.15 },
  { name: "foot", color: "#e08030", colorName: "orange", xMin: -0.53, xMax: 0.1, yMin: 0.15, yMax: 0.31 },
  { name: "front_foot", color: "#8a4c1a", colorName: "orange foncé", xMin: 0.1, xMax: 0.53, yMin: 0.15, yMax: 0.31 },
  { name: "thighs", color: "#ffb347", colorName: "orange clair", xMin: -0.53, xMax: 0.53, yMin: 0.31, yMax: 0.47 },
  { name: "tail", color: "#00aa00", colorName: "vert", xMin: -0.53, xMax: -0.25, yMin: 0.30, yMax: 0.99 },
  { name: "neck", color: "#cccc00", colorName: "jaune", xMin: 0.0, xMax: 0.25, yMin: 0.6, yMax: 0.99 },
  { name: "head", color: "#00aaaa", colorName: "cyan", xMin: -0.53, xMax: -0.35, yMin: 0.745, yMax: 0.92 },
  // Ears (drawn as part of the head mesh, not the horn-item-2d.js power-up
  // sprite - this is the "horn" the user pointed at, the crown/top-of-skull
  // silhouette bump), guessed as the topmost slice of the head-dominant
  // bounding box (x:[-0.53,-0.325] y:[0.745,0.994]) - adjust live in the
  // table below to match the actual ear shape.
  { name: "horn", color: "#ff6699", colorName: "rose", xMin: -0.53, xMax: -0.325, yMin: 0.92, yMax: 0.994 },
];

function computeZoneSplit() {
  var pos = HORSE_SKIN_2D.positions; // bind-pose local positions, stable regardless of animation
  var idx = rig.indices;
  var result = { body: [] };
  ZONES.forEach(function (z) { result[z.name] = []; });
  for (var t = 0; t < idx.length; t += 3) {
    var ia = idx[t], ib = idx[t + 1], ic = idx[t + 2];
    var cx = (pos[ia * 2] + pos[ib * 2] + pos[ic * 2]) / 3;
    var cy = (pos[ia * 2 + 1] + pos[ib * 2 + 1] + pos[ic * 2 + 1]) / 3;
    var matched = false;
    for (var z = 0; z < ZONES.length; z++) {
      var zn = ZONES[z];
      if (cx >= zn.xMin && cx <= zn.xMax && cy >= zn.yMin && cy <= zn.yMax) {
        result[zn.name].push(ia, ib, ic);
        matched = true;
        break;
      }
    }
    if (!matched) result.body.push(ia, ib, ic);
  }
  Object.keys(result).forEach(function (k) { result[k] = new Uint16Array(result[k]); });
  return result;
}
var zoneSplit = computeZoneSplit();

var mode = "bones";
var enabled = {};
var colors = {};
GROUPS.forEach(function (g) { enabled[g.name] = true; colors[g.name] = g.color; });
var zoneEnabled = { body: true };
var zoneColors = { body: "#c98a52" };
ZONES.forEach(function (z) { zoneEnabled[z.name] = true; zoneColors[z.name] = z.color; });

function drawTriangles(idx, fillStyle) {
  var pos = rig.skinnedPositions;
  ctx.fillStyle = fillStyle;
  ctx.beginPath();
  for (var t = 0; t < idx.length; t += 3) {
    var ia = idx[t], ib = idx[t + 1], ic = idx[t + 2];
    ctx.moveTo(pos[ia * 2] * SCALE + OFFSET_X, -pos[ia * 2 + 1] * SCALE + OFFSET_Y);
    ctx.lineTo(pos[ib * 2] * SCALE + OFFSET_X, -pos[ib * 2 + 1] * SCALE + OFFSET_Y);
    ctx.lineTo(pos[ic * 2] * SCALE + OFFSET_X, -pos[ic * 2 + 1] * SCALE + OFFSET_Y);
    ctx.closePath();
  }
  ctx.fill();
}

// Checkerboard grid in mesh-local units (same units as the zone x/y bounds
// above), one cell per GRID_STEP, with axis labels - lets you read off
// coordinates directly instead of guessing zone bounds blind.
var GRID_STEP = 0.1;
function meshToScreen(x, y) {
  return [x * SCALE + OFFSET_X, -y * SCALE + OFFSET_Y];
}
function drawGrid() {
  var left = -OFFSET_X / SCALE, right = (canvas.width - OFFSET_X) / SCALE;
  var top = OFFSET_Y / SCALE, bottom = (OFFSET_Y - canvas.height) / SCALE;
  var xStart = Math.floor(left / GRID_STEP) * GRID_STEP;
  var yStart = Math.floor(bottom / GRID_STEP) * GRID_STEP;

  var col = 0;
  for (var gx = xStart; gx <= right; gx += GRID_STEP, col++) {
    var row = 0;
    for (var gy = yStart; gy <= top; gy += GRID_STEP, row++) {
      var p0 = meshToScreen(gx, gy);
      ctx.fillStyle = (col + row) % 2 === 0 ? "#eee" : "#ddd";
      ctx.fillRect(p0[0], p0[1] - GRID_STEP * SCALE, GRID_STEP * SCALE, GRID_STEP * SCALE);
    }
  }

  ctx.strokeStyle = "#f33";
  ctx.lineWidth = 1;
  var origin = meshToScreen(0, 0);
  ctx.beginPath();
  ctx.moveTo(0, origin[1]); ctx.lineTo(canvas.width, origin[1]);
  ctx.moveTo(origin[0], 0); ctx.lineTo(origin[0], canvas.height);
  ctx.stroke();

  ctx.fillStyle = "#333";
  ctx.font = "10px sans-serif";
  for (var lx = xStart; lx <= right; lx += GRID_STEP) {
    if (Math.abs(lx) < 1e-9) continue;
    var pl = meshToScreen(lx, 0);
    ctx.fillText(lx.toFixed(1), pl[0] + 2, origin[1] - 2);
  }
  for (var ly = yStart; ly <= top; ly += GRID_STEP) {
    if (Math.abs(ly) < 1e-9) continue;
    var pl2 = meshToScreen(0, ly);
    ctx.fillText(ly.toFixed(1), origin[0] + 2, pl2[1] - 2);
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  if (mode === "bones") {
    GROUPS.forEach(function (g) {
      if (enabled[g.name]) drawTriangles(boneSplit[g.name], colors[g.name]);
    });
  } else {
    if (zoneEnabled.body) drawTriangles(zoneSplit.body, zoneColors.body);
    ZONES.forEach(function (z) {
      if (zoneEnabled[z.name]) drawTriangles(zoneSplit[z.name], zoneColors[z.name]);
    });
  }
}

var legend = document.querySelector("#legend");
GROUPS.forEach(function (g) {
  var label = document.createElement("label");
  var checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.checked = true;
  checkbox.addEventListener("change", function () {
    enabled[g.name] = checkbox.checked;
    render();
  });
  var colorSelect = document.createElement("select");
  GROUPS.forEach(function (opt) {
    var option = document.createElement("option");
    option.value = opt.color;
    option.textContent = opt.colorName;
    option.style.background = opt.color;
    if (opt.color === g.color) option.selected = true;
    colorSelect.appendChild(option);
  });
  colorSelect.addEventListener("change", function () {
    colors[g.name] = colorSelect.value;
    render();
  });
  label.appendChild(checkbox);
  label.appendChild(colorSelect);
  label.appendChild(document.createTextNode(g.name + " (" + boneSplit[g.name].length / 3 + " tris)"));
  legend.appendChild(label);
});

var colorLegend = document.querySelector("#colorLegend");
GROUPS.forEach(function (g) {
  var span = document.createElement("span");
  var swatch = document.createElement("span");
  swatch.className = "swatch";
  swatch.style.background = g.color;
  span.appendChild(swatch);
  span.appendChild(document.createTextNode(g.colorName + " = " + g.name));
  colorLegend.appendChild(span);
});

// ---- Zone table: editable x/y bounds per zone, rebuilds the zone split
// and redraws on any change.
var zoneTableBody = document.querySelector("#zoneTable tbody");
function rebuildZoneTable() {
  zoneTableBody.innerHTML = "";
  zoneSplit = computeZoneSplit();
  var rows = [{ name: "body", isBody: true }].concat(ZONES);
  rows.forEach(function (z) {
    var tr = document.createElement("tr");

    var nameTd = document.createElement("td");
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = zoneEnabled[z.name];
    cb.addEventListener("change", function () { zoneEnabled[z.name] = cb.checked; render(); });
    nameTd.appendChild(cb);
    nameTd.appendChild(document.createTextNode(" " + z.name));
    tr.appendChild(nameTd);

    var colorTd = document.createElement("td");
    var sel = document.createElement("select");
    ZONES.concat([{ color: "#c98a52", colorName: "brun clair" }]).forEach(function (opt) {
      var option = document.createElement("option");
      option.value = opt.color;
      option.textContent = opt.colorName;
      option.style.background = opt.color;
      if (opt.color === zoneColors[z.name]) option.selected = true;
      sel.appendChild(option);
    });
    sel.addEventListener("change", function () { zoneColors[z.name] = sel.value; render(); });
    colorTd.appendChild(sel);
    tr.appendChild(colorTd);

    ["xMin", "xMax", "yMin", "yMax"].forEach(function (field) {
      var td = document.createElement("td");
      if (z.isBody) { td.textContent = "-"; tr.appendChild(td); return; }
      var input = document.createElement("input");
      input.type = "number";
      input.step = "0.01";
      input.value = z[field];
      input.addEventListener("input", function () {
        z[field] = parseFloat(input.value) || 0;
        zoneSplit = computeZoneSplit();
        updateTriCounts();
        render();
      });
      td.appendChild(input);
      tr.appendChild(td);
    });

    var trisTd = document.createElement("td");
    trisTd.className = "tris-count";
    trisTd.textContent = zoneSplit[z.name].length / 3;
    tr.appendChild(trisTd);

    tr.dataset.zoneName = z.name;
    zoneTableBody.appendChild(tr);
  });
}
function updateTriCounts() {
  Array.prototype.forEach.call(zoneTableBody.children, function (tr) {
    tr.querySelector(".tris-count").textContent = zoneSplit[tr.dataset.zoneName].length / 3;
  });
}
rebuildZoneTable();

document.querySelectorAll('input[name="mode"]').forEach(function (radio) {
  radio.addEventListener("change", function () {
    mode = radio.value;
    document.querySelector("#legend").hidden = mode !== "bones";
    document.querySelector("#zoneTable").hidden = mode !== "zones";
    document.querySelector("#copyZonesBtn").hidden = mode !== "zones";
    render();
  });
});

// Copies the current zone definitions (name, color, bounds, live triangle
// count) as JSON to the clipboard - so a chosen split can be pasted
// straight into game.js/level code without retyping the numbers by hand.
document.querySelector("#copyZonesBtn").addEventListener("click", function () {
  var data = ZONES.map(function (z) {
    return {
      name: z.name,
      color: zoneColors[z.name],
      xMin: z.xMin, xMax: z.xMax, yMin: z.yMin, yMax: z.yMax,
      tris: zoneSplit[z.name].length / 3,
    };
  });
  var json = JSON.stringify(data, null, 2);
  var status = document.querySelector("#copyZonesStatus");
  navigator.clipboard.writeText(json).then(function () {
    status.textContent = "Copié !";
    setTimeout(function () { status.textContent = ""; }, 1500);
  }, function () {
    status.textContent = "Échec de la copie (voir console)";
    console.log(json);
  });
});

render();
</script>
</body>
</html>
