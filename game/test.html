<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Horn items test</title>
<style>
  html, body { margin: 0; background: #e8f4fb; font-family: sans-serif; }
  canvas { display: block; margin: 40px auto; background: #fff; border: 1px solid #ccc; }
  p { text-align: center; color: #333; }
</style>
</head>
<body>
<p>7 variantes de corne magique (ROYGBIV), forme identique - test visuel isole. Rotation lente pour verifier la lisibilite sous tous les angles.</p>
<canvas id="canvas" width="900" height="260"></canvas>
<script src="horn-item-2d.js"></script>
<script>
"use strict";
var canvas = document.querySelector("#canvas");
var ctx = canvas.getContext("2d");

var start = null;
function draw(ts) {
  if (start === null) start = ts;
  var time = (ts - start) / 1000;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  var count = HORN_COLORS.length;
  var spacing = canvas.width / (count + 1);
  for (var i = 0; i < count; i++) {
    var x = spacing * (i + 1);
    var y = canvas.height / 2 + 20;
    var wobble = Math.sin(time * 1.5 + i) * 0.08;
    drawHornItem(ctx, x, y, 120, i, wobble);
    ctx.fillStyle = "#333";
    ctx.font = "13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(HORN_COLORS[i], x, y + 90);
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
